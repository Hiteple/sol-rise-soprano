[build]
  command = "vite build"
  publish = "dist/client"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

[images]
  remote_images = ["https://picsum\\.photos/.*"]

# Temporary maintenance mode (production only).
# This redirect is scoped to production so local `npm run dev`
# can keep showing the full site while the live site is locked.
[[context.production.redirects]]
  from = "/*"
  to = "/coming-soon.html"
  status = 302
  force = true
