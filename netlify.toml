[build]
  command = "vite build"
  publish = "dist/client"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

[images]
  remote_images = ["https://picsum\\.photos/.*"]

# Maintenance mode for live site (production deploys only).
# Generates a Netlify `_redirects` file at build-time in production.
# Local `npm run dev` is unaffected.
[context.production]
  command = "vite build && printf '/* /coming-soon.html 302!\\n' > dist/client/_redirects"
