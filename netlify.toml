[build]
  command = "vite build"
  publish = "dist/client"

[build.environment]
  NETLIFY = "true"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

[images]
  remote_images = ["https://picsum\\.photos/.*"]

# Long-lived cache for fingerprinted build assets and fonts.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Source images — weekly cache; transforms are cached separately on the CDN edge.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# ==========================================
# Maintenance mode toggle (PRODUCTION ONLY)
# ==========================================
# Local `npm run dev` is unaffected.
#
# IMPORTANT:
# Change ONLY the `command` line directly below `[context.production]`.
# Do not change `[build].command` above (that one is global/default).
#
# If you want ON (live locked to coming-soon), use:
#   command = "vite build && printf '/* /coming-soon.html 302!\\n' > dist/client/_redirects"
#
# If you want OFF (live site normal), use:
#   command = "vite build"
#
# After changing that one line, run a new Netlify deploy.
[context.production]
  command = "vite build"
